name: Jellytip build

on:
  push:
    branches:
      - jellytip
      - jellytip-*
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Fetch upstream tags
        run: git fetch --tags https://github.com/damontecres/Wholphin.git || true
      - name: Setup
        uses: ./.github/actions/setup
      - name: "Jellytip fixture scan (public repo: no provider names, non-TMDB links or tokens)"
        run: bash .github/scripts/jellytip-fixture-scan.sh
      - name: Jellytip unit tests
        run: ./gradlew testDefaultDebugUnitTest --tests 'com.github.damontecres.wholphin.jellytip.debug.*' --tests 'com.github.damontecres.wholphin.jellytip.cards.*' --tests 'com.github.damontecres.wholphin.jellytip.iptv.*' --tests 'com.github.damontecres.wholphin.jellytip.search.*' --tests 'com.github.damontecres.wholphin.jellytip.rows.*' --no-daemon
      - name: Build debug app
        run: ./gradlew assembleDefaultDebug --no-daemon
      - name: Build release app
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: ./gradlew assembleDefaultRelease --no-daemon
      - name: Upload release APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jellytip-release-apk
          path: app/build/outputs/apk/default/release/*.apk
          retention-days: 14
      # R8 mapping for the release build, to de-obfuscate crash stacks (artifact only: the repo is public, never in a release)
      - name: Upload release R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jellytip-release-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/defaultRelease/mapping.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jellytip-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          retention-days: 14
