name: Jellytip phone build

# Android phone app: the web client (web/) in a Capacitor wrapper (web/android). Gradle can't run on the dev host.
on:
  push:
    branches:
      - jellytip-web
      - jellytip-phone*
    paths:
      - web/**
      - .github/workflows/jellytip-phone.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install web dependencies
        run: npm ci
      - name: Unit tests (download queue rules)
        run: npm test
      - name: Build web bundle and sync into the Android project
        run: npm run build:android
      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "$SIGNING_KEY" | base64 -d > android/app/ci.keystore; else echo "No signing secret: release will be debug-signed"; fi
      - name: Build release APK
        working-directory: web/android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/jellytip-phone-${GITHUB_RUN_NUMBER}.apk
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jellytip-phone-apk
          path: web/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
